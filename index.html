<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Arena</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="#"><img src="./img/logo1.svg" alt="Board Game Arena" /></a>
      </div>
      <div>
        <form class="headerSearch">
          <input type="text" placeholder="搜尋遊戲..." />
          <button type="btnSearch">
            <img src="./img/icn/search.svg" alt="searchIcon" />
          </button>
        </form>
        <div>
          <a class="btnPlaynow" href="#"
            ><img src="./img/icn/game.svg" alt="paly now" />立即遊玩
          </a>
          <div class="divider"></div>
          <a class="btnNav" href="#"
            ><img src="./img/icn/list.svg" alt="bga game list" />遊戲列表
          </a>
          <a class="btnNav" href="#"
            ><img src="./img/icn/news.svg" alt="bga news" />新聞
          </a>
          <a class="btnNav" href="#"
            ><img src="./img/icn/chat.svg" alt="bga chat" />討論區
          </a>
          <div>
            <button class="btnNotify">
              <img src="./img/icn/bell.svg" alt="bga notify" />
            </button>
            <button class="btnMe">
              <img src="./img/icn/me.svg" alt="bga me" />
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
