        <!-- 平板版：漢堡選單（CSS-only，checkbox + label 沿用 .tag-item 的隱藏 input 技巧） -->

          <input type="checkbox" class="hamburger-toggle" />
          <span class="hamburger-icon">

              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"

              <path
                d="M3 6H21M3 12H21M3 18H21"

        <nav class="mobile-nav-panel" hidden>
          <a class="mobile-nav-link" href="#"
            ><img src="./img/icn/list.svg" alt="bga game list" />遊戲列表</a

          <a class="mobile-nav-link" href="#"
            ><img src="./img/icn/news.svg" alt="bga news" />新聞</a

    </header>
    <!-- 平板版：搜尋框移到 header 正下方，獨立一行 -->

      <input type="text" placeholder="搜尋遊戲..." />
      <button type="button" class="btn-search">
        <svg

          width="24"
          height="24"
          viewBox="0 0 24 24"

    <div class="homepage-wrapper">
      <div class="homepage-layout">
        <aside class="homepage-filter">
          <div class="filter-title">
            <h2>篩選遊戲</h2>
            <p>FILTER QUEST</p>
          </div>
          <!-- 平板版：水平篩選 bar，取代桌機版垂直側欄；tab 切換用 radio + :checked（純 CSS） -->
          <!-- mf-tab-none：隱藏的「重置」radio，用來實現「再按一次 / 點外面收合」，不算在 .mobile-filter-radio 群組內 -->
          <input
            type="radio"
            name="mobile-filter-tab"
            id="mf-tab-none"
            class="mobile-filter-radio-none"
            hidden
          />
          <label class="mobile-filter-backdrop" for="mf-tab-none" hidden></label>
          <div class="mobile-filter-bar" hidden>
            <span class="mobile-filter-label">篩選遊戲：</span>
            <div class="mobile-filter-tabs">
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-players"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-players"
                  ><img src="./img/icn/people.svg" alt="" />玩家數</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/people.svg" alt="" />玩家數</label
                >
              </span>
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-time"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-time"
                  ><img src="./img/icn/time.svg" alt="" />遊玩時間</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/time.svg" alt="" />遊玩時間</label
                >
              </span>
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-complexity"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-complexity"
                  ><img src="./img/icn/complex.svg" alt="" />遊戲複雜度</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/complex.svg" alt="" />遊戲複雜度</label
                >
              </span>
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-theme"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-theme"
                  ><img src="./img/icn/castle.svg" alt="" />主題</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/castle.svg" alt="" />主題</label
                >
              </span>
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-mechanism"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-mechanism"
                  ><img src="./img/icn/mechanism.svg" alt="" />遊戲機制</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/mechanism.svg" alt="" />遊戲機制</label
                >
              </span>
              <span class="mobile-filter-tab-slot">
                <input
                  type="radio"
                  name="mobile-filter-tab"
                  id="mf-tab-specific"
                  class="mobile-filter-radio"
                />
                <label class="mobile-filter-tab-btn" for="mf-tab-specific"
                  ><img src="./img/icn/specificType.svg" alt="" />特定類型</label
                >
                <label
                  class="mobile-filter-tab-btn mobile-filter-tab-close"
                  for="mf-tab-none"
                  ><img src="./img/icn/specificType.svg" alt="" />特定類型</label
                >
              </span>
            </div>
          </div>
          <div class="filter-layout">
            <form class="filter-content" data-tab="players">

                  <button class="filter-toggle" type="button">

                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      不限
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      1人 [單人模式]
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="2"
                      />
                      2人 [對決模式]
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="3-5"
                      />

                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="6-9"
                      />
                      6-9人
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="10plus"
                      />
                      10+人
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content" data-tab="time">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img

                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      不限
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"

                      />

                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="2"

                    <label class="option-item">

                        type="radio"
                        name="players"
                        value="3-5"
                      />

                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content" data-tab="complexity">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span

                    <span class="filter-toggle-arrow">▲</span>

                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input

                        type="radio"
                        name="complex"
                        value="1"
                      />

                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="1"
                      />

                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="2"
                      />

                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="3-5"
                      />
                      適合深度玩家
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content" data-tab="theme">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span

                        src="./img/icn/castle.svg"

                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="tag-group option-content-gap">
                    <label class="tag-item">
                      <input

                    <label class="tag-item">
                      <input type="checkbox" name="type" value="fantasy" />

                    <label class="tag-item">
                      <input type="checkbox" name="type" value="conquer" /><span

                    <label class="tag-item">
                      <input

                        name="type"
                        value="abstract"

                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"

                    <label class="tag-item">

                    <label class="tag-item">

                    <label class="tag-item">

                    <label class="tag-item">

                    <label class="tag-item">

                    <label class="tag-item">

                    <label class="tag-item">

        <main class="homepage-content">
          <h1 class="visually-hidden">Board Game Arena - 探索桌遊的無限可能</h1>

            <img src="./img/zombicide-banner.jpg" alt="Zombicide 2nd Edition" />
            <h2 class="featured-tag">精選推薦</h2>
            <div class="featured-content">
