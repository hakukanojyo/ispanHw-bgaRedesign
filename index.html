<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board Game Arena</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="header-logo">
          <a href="#"><img src="./img/logo1.svg" alt="Board Game Arena" /></a>
        </div>
        <div class="header-navbar">
          <form class="header-search">
            <input type="text" placeholder="搜尋遊戲..." />
            <button type="button" class="btn-search">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M9.5 16C7.68333 16 6.146 15.3707 4.888 14.112C3.63 12.8533 3.00067 11.316 3 9.5C2.99933 7.684 3.62867 6.14667 4.888 4.888C6.14733 3.62933 7.68467 3 9.5 3C11.3153 3 12.853 3.62933 14.113 4.888C15.373 6.14667 16.002 7.684 16 9.5C16 10.2333 15.8833 10.925 15.65 11.575C15.4167 12.225 15.1 12.8 14.7 13.3L20.3 18.9C20.4833 19.0833 20.575 19.3167 20.575 19.6C20.575 19.8833 20.4833 20.1167 20.3 20.3C20.1167 20.4833 19.8833 20.575 19.6 20.575C19.3167 20.575 19.0833 20.4833 18.9 20.3L13.3 14.7C12.8 15.1 12.225 15.4167 11.575 15.65C10.925 15.8833 10.2333 16 9.5 16ZM9.5 14C10.75 14 11.8127 13.5627 12.688 12.688C13.5633 11.8133 14.0007 10.7507 14 9.5C13.9993 8.24933 13.562 7.187 12.688 6.313C11.814 5.439 10.7513 5.00133 9.5 5C8.24867 4.99867 7.18633 5.43633 6.313 6.313C5.43967 7.18967 5.002 8.252 5 9.5C4.998 10.748 5.43567 11.8107 6.313 12.688C7.19033 13.5653 8.25267 14.0027 9.5 14Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </form>
          <div class="navbar">
            <div class="navbar-links">
              <a class="btn-playnow" href="#"
                ><img src="./img/icn/game.svg" alt="paly now" />立即遊玩
              </a>
              <div class="divider"></div>
              <a class="btn-nav" href="#"
                ><img src="./img/icn/list.svg" alt="bga game list" />遊戲列表
              </a>
              <a class="btn-nav" href="#"
                ><img src="./img/icn/news.svg" alt="bga news" />新聞
              </a>
              <a class="btn-nav" href="#"
                ><img src="./img/icn/chat.svg" alt="bga chat" />討論區
              </a>
            </div>
            <div class="navbar-actions">
              <button class="btn-notify">
                <img src="./img/icn/bell.svg" alt="bga notify" />
              </button>
              <button class="btn-me">
                <img src="./img/icn/me.svg" alt="bga me" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="homepage-wrapper">
      <div class="homepage-layout">
        <aside class="homepage-filter">
          <div class="filter-title">
            <h2>篩選遊戲</h2>
            <p>FILTER QUEST</p>
          </div>
          <div class="filter-layout">
            <form class="filter-content">
              <!-- <p>
              <img src="./img/icn/cancel.svg" alt="cancel icon" />清除篩選條件
            </p> -->
              <div class="filter-option">
                <div class="option">
                  <!-- <div class="option-title">
                  <h3><img src="./img/icn/people.svg" alt="" />玩家數</h3>
                  <span class="filter-toggle-arrow">▼</span>
                </div> -->
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/people.svg"
                        alt="人數icon"
                      />玩家數</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      不限
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      1人 [單人模式]
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="2"
                      />
                      2人 [對決模式]
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="3-5"
                      />
                      3-5人
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="6-9"
                      />
                      6-9人
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="10plus"
                      />
                      10+人
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/time.svg"
                        alt="時間icon"
                      />遊玩時間</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      不限
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="1"
                      />
                      簡短
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="2"
                      />
                      長度適中
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="players"
                        value="3-5"
                      />
                      耗時 [大於30分鐘]
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/complex.svg"
                        alt="遊戲複雜度icon"
                      />遊戲複雜度</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="people-content option-content-gap">
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="1"
                      />
                      不限
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="1"
                      />
                      休閒小品
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="2"
                      />
                      適合一般玩家
                    </label>
                    <label class="option-item">
                      <input
                        class="radio-box"
                        type="radio"
                        name="complex"
                        value="3-5"
                      />
                      適合深度玩家
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/castle.svg"
                        alt="主題icon"
                      />遊戲主題</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="tag-group option-content-gap">
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="western style"
                      />
                      <span>西部風格</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="fantasy" />
                      <span>奇幻</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="conquer" /><span
                        >征服</span
                      >
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="abstract"
                      /><span>抽象</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="adventure"
                      /><span>冒險</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="construction"
                      /><span>建設</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="science fiction"
                      /><span>科幻</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="food" /><span
                        >食物</span
                      >
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="type"
                        value="aviation"
                      /><span>航空</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="animal" /><span
                        >動物</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="explore" /><span
                        >探索</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="surreal" /><span
                        >超現實 / 滑稽 / 荒誕</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="spy" /><span
                        >間諜</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="economy" /><span
                        >經濟</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="sports" /><span
                        >運動</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="war" /><span
                        >戰爭遊戲</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="history" /><span
                        >歷史</span
                      >
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="type" value="railway" /><span
                        >鐵路</span
                      >
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/mechanism.svg"
                        alt="遊戲機制icon"
                      />遊戲機制</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="tag-group option-content-gap">
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="mechanism"
                        value="manual placement"
                      />
                      <span>人工放置</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="mechanism"
                        value="not equal"
                      />
                      <span>不對等</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="mechanism"
                        value="engine building"
                      />
                      <span>引擎構築</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="mechanism" value="card" />
                      <span>卡牌</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="mechanism"
                        value="word play"
                      />
                      <span>文字遊戲</span>
                    </label>
                    <label class="tag-item">
                      <input type="checkbox" name="mechanism" value="target" />
                      <span>目標</span>
                    </label>
                  </div>
                </div>
              </div>
            </form>
            <form class="filter-content">
              <div class="filter-option">
                <div class="option">
                  <button class="filter-toggle" type="button">
                    <span
                      ><img
                        src="./img/icn/specificType.svg"
                        alt="bga特定類型icon"
                      />特定類型</span
                    >
                    <span class="filter-toggle-arrow">▲</span>
                  </button>
                  <div class="option-divider"></div>
                  <div class="tag-group option-content-gap">
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="party game"
                      />
                      <span>派對遊戲</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="origin"
                      />
                      <span>原創</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="family"
                      />
                      <span>家庭</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="round"
                      />
                      <span>推薦以回合制遊玩</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="rightnow"
                      />
                      <span>推薦以即時制遊玩</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="classic"
                      />
                      <span>經典</span>
                    </label>
                    <label class="tag-item">
                      <input
                        type="checkbox"
                        name="specificType"
                        value="award"
                      />
                      <span>獲獎遊戲</span>
                    </label>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </aside>
        <main class="homepage-content">
          <h1 class="visually-hidden">Board Game Arena - 探索桌遊的無限可能</h1>
        </main>
        <div class="homepage-function"></div>
      </div>
    </div>
  </body>
</html>
